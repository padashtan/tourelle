name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Layers: build+unit tests gate the rest; analysis, sanitizer and lint run in
# parallel; packaging, signing (once configured) and the release come last.
# Third-party actions are pinned to full commit SHAs (tag in the comment).
jobs:
  build:
    runs-on: windows-2022
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: x64

      - name: Configure and build (warnings are errors)
        run: |
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOURELLE_WERROR=ON
          cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Check the binaries
        shell: pwsh
        run: |
          $exports = dumpbin /exports build\TourelleCamera.dll | Out-String
          foreach ($name in 'DllGetClassObject', 'DllCanUnloadNow') {
            if ($exports -notmatch $name) { throw "TourelleCamera.dll does not export $name" }
          }
          # The Frame Server must not need a VC++ redistributable.
          $deps = dumpbin /dependents build\TourelleCamera.dll | Out-String
          if ($deps -match 'VCRUNTIME|MSVCP') { throw "TourelleCamera.dll depends on the VC++ runtime:`n$deps" }
          # Control Flow Guard and CET compatibility on everything that ships.
          foreach ($file in 'Tourelle.exe', 'TourelleCamera.dll', 'tourelle-cli.exe') {
            $headers = dumpbin /headers /loadconfig "build\$file" | Out-String
            if ($headers -notmatch 'Control Flow Guard') { throw "$file is not built with /guard:cf" }
            if ($headers -notmatch 'CET compatible') { throw "$file is not built with /CETCOMPAT" }
          }

      - name: Planted-DLL test (no DLL loaded from the executables' folder)
        shell: pwsh
        run: tools\test-planted-dlls.ps1 -BuildDir build

      - name: Package (zip)
        shell: pwsh
        run: |
          $root = 'dist\tourelle'
          New-Item -ItemType Directory -Force $root | Out-Null
          # TourelleCamera.dll is embedded in Tourelle.exe (written by its elevated setup).
          Copy-Item build\Tourelle.exe, build\tourelle-cli.exe $root
          Copy-Item README.md, LICENSE, CHANGELOG.md $root
          Compress-Archive -Path "$root\*" -DestinationPath dist\tourelle-windows-x64.zip

      - name: Installer (Inno Setup 6.7.3, verified download)
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-6.7.3.exe"
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw "Inno Setup checksum mismatch: $hash" }
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$env:RUNNER_TEMP\inno" -Wait
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.0' }
          & "$env:RUNNER_TEMP\inno\ISCC.exe" /Q "/DAppVersion=$version" /DBinDir=..\build installer\Tourelle.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }

      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: tourelle-windows-x64
          path: |
            dist/tourelle-windows-x64.zip
            dist/tourelle-setup-*.exe

  analyze:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: x64
      - name: MSVC code analysis (/analyze, warnings are errors)
        run: |
          cmake -S native -B build-analyze -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOURELLE_ANALYZE=ON -DTOURELLE_WERROR=ON
          cmake --build build-analyze

  sanitizer:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: x64
      - name: Unit tests under AddressSanitizer
        run: |
          cmake -S native -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTOURELLE_ASAN=ON -DTOURELLE_WERROR=OFF
          cmake --build build-asan --target tourelle-tests
          ctest --test-dir build-asan --output-on-failure

  lint:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path tools -Severity Error, Warning
          $issues | Format-Table -AutoSize
          if ($issues) { throw "PSScriptAnalyzer found issues" }

  # Releases come only from version tags that point to a commit of main.
  tag-check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Tag commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  sign:
    # Runs once SignPath is configured (see docs/signing.md). The "release"
    # environment must require a reviewer in the repository settings.
    # Order matters: the camera source DLL is signed first, then embedded in
    # Tourelle.exe; the executables are signed, then packaged; the setup is signed last.
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    needs: [build, analyze, sanitizer, lint, tag-check]
    runs-on: windows-2022
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
        with:
          arch: x64

      - name: Build
        run: |
          cmake -S native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTOURELLE_WERROR=ON
          cmake --build build --target TourelleCamera

      # 1. Camera source DLL
      - id: dll
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: to-sign-dll
          path: build/TourelleCamera.dll
      - uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e  # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.dll.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-dll

      # 2. Executables, with the signed DLL embedded
      - name: Build the executables around the signed DLL
        shell: pwsh
        run: |
          if ((Get-AuthenticodeSignature signed-dll\TourelleCamera.dll).Status -ne 'Valid') { throw "DLL not signed" }
          $signed = "$env:GITHUB_WORKSPACE/signed-dll/TourelleCamera.dll"
          cmake -S native -B build -DTOURELLE_EMBEDDED_SOURCE="$signed"
          if ($LASTEXITCODE) { throw "cmake configure failed" }
          cmake --build build --target Tourelle tourelle-cli
          if ($LASTEXITCODE) { throw "cmake build failed" }
          # The DLL embedded in Tourelle.exe (RCDATA 2) must be the signed one, byte for byte.
          tools\extract-embedded-source.ps1 -Exe build\Tourelle.exe -Out embedded.dll
          if ((Get-FileHash embedded.dll).Hash -ne (Get-FileHash $signed).Hash) { throw "Tourelle.exe does not embed the signed DLL" }
          New-Item -ItemType Directory -Force to-sign-exe | Out-Null
          Copy-Item build\Tourelle.exe, build\tourelle-cli.exe to-sign-exe
      - id: exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: to-sign-exe
          path: to-sign-exe/
      - uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e  # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe

      # 3. Packages from the signed executables, then the signed setup
      - name: Package and build the installer
        shell: pwsh
        run: |
          foreach ($file in 'Tourelle.exe', 'tourelle-cli.exe') {
            if ((Get-AuthenticodeSignature "signed-exe\$file").Status -ne 'Valid') { throw "$file not signed" }
          }
          tools\test-planted-dlls.ps1 -BuildDir signed-exe
          if ($LASTEXITCODE) { throw "planted-DLL test failed on the signed executables" }
          New-Item -ItemType Directory -Force dist\tourelle | Out-Null
          Copy-Item signed-exe\Tourelle.exe, signed-exe\tourelle-cli.exe, README.md, LICENSE, CHANGELOG.md dist\tourelle
          Compress-Archive -Path dist\tourelle\* -DestinationPath dist\tourelle-windows-x64.zip
          $setup = "$env:RUNNER_TEMP\innosetup-6.7.3.exe"
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw "Inno Setup checksum mismatch" }
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$env:RUNNER_TEMP\inno" -Wait
          & "$env:RUNNER_TEMP\inno\ISCC.exe" /Q "/DAppVersion=$($env:GITHUB_REF_NAME.TrimStart('v'))" /DBinDir=..\signed-exe installer\Tourelle.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }
      - id: setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: to-sign-setup
          path: dist/tourelle-setup-*.exe
      - uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e  # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Collect the release files
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem signed-setup -Filter 'tourelle-setup-*.exe')
          if ($setups.Count -ne 1) { throw "expected one signed setup, found $($setups.Count)" }
          if ((Get-AuthenticodeSignature $setups[0].FullName).Status -ne 'Valid') { throw "setup not signed" }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\tourelle-windows-x64.zip, $setups[0].FullName release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: tourelle-windows-x64-signed
          path: release/

  release:
    # Publishes the signed files when signing is configured, the unsigned ones otherwise.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success' && needs.analyze.result == 'success' &&
      needs.sanitizer.result == 'success' && needs.lint.result == 'success' &&
      needs.tag-check.result == 'success' &&
      (needs.sign.result == 'success' || (needs.sign.result == 'skipped' && vars.SIGNPATH_ORGANIZATION_ID == ''))
    needs: [build, analyze, sanitizer, lint, tag-check, sign]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: ${{ needs.sign.result == 'success' && 'tourelle-windows-x64-signed' || 'tourelle-windows-x64' }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            tourelle-windows-x64.zip
            tourelle-setup-*.exe
          generate_release_notes: true
