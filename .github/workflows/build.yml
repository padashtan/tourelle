name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S native -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Check exports of the media source
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          $exports = & $dumpbin.FullName /exports build\Release\TourelleCamera.dll | Out-String
          foreach ($name in 'DllGetClassObject', 'DllCanUnloadNow') {
            if ($exports -notmatch $name) { throw "TourelleCamera.dll does not export $name" }
          }
          # The Frame Server must not need a VC++ redistributable.
          $deps = & $dumpbin.FullName /dependents build\Release\TourelleCamera.dll | Out-String
          if ($deps -match 'VCRUNTIME|MSVCP') { throw "TourelleCamera.dll depends on the VC++ runtime:`n$deps" }

      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path tools -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { throw "PSScriptAnalyzer found errors" }

      - name: Package
        shell: pwsh
        run: |
          $root = 'dist\tourelle'
          New-Item -ItemType Directory -Force "$root\bin", "$root\tools" | Out-Null
          Copy-Item build\Release\TourelleCamera.dll, build\Release\tourelle.exe, build\Release\uvcgrab.exe "$root\bin"
          Copy-Item tools\*.ps1 "$root\tools"
          Copy-Item README.md, LICENSE $root
          Compress-Archive -Path "$root\*" -DestinationPath dist\tourelle-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tourelle-windows-x64
          path: dist/tourelle-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tourelle-windows-x64

      - uses: softprops/action-gh-release@v2
        with:
          files: tourelle-windows-x64.zip
          generate_release_notes: true
